<fieldset class="flex items-center px-1 py-1">
  <legend class="sr-only">{{ 'APP.THEME' | translate }}</legend>
  <button type="button" (click)="setTheme('light')" [attr.aria-pressed]="themeService.theme() === 'light'" class="grid size-7 place-items-center transition focus:outline-none focus:ring-2 focus:ring-inset focus:ring-cyan-500" [class.bg-slate-950]="themeService.theme() === 'light'" [class.text-white]="themeService.theme() === 'light'" [class.dark:bg-cyan-300]="themeService.theme() === 'light'" [class.dark:text-slate-950]="themeService.theme() === 'light'" [attr.aria-label]="'APP.THEME_LIGHT' | translate"><svg aria-hidden="true" class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
  <button type="button" (click)="setTheme('dark')" [attr.aria-pressed]="themeService.theme() === 'dark'" class="grid size-7 place-items-center transition focus:outline-none focus:ring-2 focus:ring-inset focus:ring-cyan-500" [class.bg-slate-950]="themeService.theme() === 'dark'" [class.text-white]="themeService.theme() === 'dark'" [class.dark:bg-cyan-300]="themeService.theme() === 'dark'" [class.dark:text-slate-950]="themeService.theme() === 'dark'" [attr.aria-label]="'APP.THEME_DARK' | translate"><svg aria-hidden="true" class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.27 15.79A9 9 0 0 1 8.21 3.73 9 9 0 1 0 20.27 15.79Z"/></svg></button>
</fieldset>
